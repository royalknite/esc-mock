    <script>
      // Standard Service Worker Registration for valid standalone Chrome PWA identification
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: './' })
            .then(function(reg) {
              console.log('PWA ServiceWorker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('PWA ServiceWorker registration error:', err);
            });
        });
      }

      // Capture beforeinstallprompt immediately on load for seamless 1-tap installation
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
