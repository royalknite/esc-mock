<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-Bleed Royal/Navy Gradient for Maskable Background -->
    <linearGradient id="bgGradMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091429"/>
      <stop offset="45%" stop-color="#0e234e"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="redGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background with zero radius for arbitrary adaptive masking -->
  <rect width="512" height="512" fill="url(#bgGradMaskable)"/>

  <!-- Radial highlight -->
  <circle cx="256" cy="256" r="220" fill="#2563eb" opacity="0.18"/>

  <!-- Safe Zone Scaled Group (Scaled 0.82 to guarantee 100% visibility in circular / squircle masks) -->
  <g transform="translate(46, 46) scale(0.82)">
    <!-- Center Crest Container -->
    <g filter="url(#shadowMask)">
      <!-- Crimson Ribbon -->
      <path d="M 156 50 L 356 50 Q 366 50 368 60 L 378 116 Q 380 126 370 130 L 256 156 L 142 130 Q 132 126 134 116 L 144 60 Q 146 50 156 50 Z" fill="url(#redGradMask)"/>
      <text x="256" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">ACADEMIC EXCELLENCE</text>
      <text x="256" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#fef08a" text-anchor="middle" letter-spacing="2">ESTD. SASARAM • 2026-27</text>

      <!-- Monogram Plaque -->
      <rect x="116" y="140" width="280" height="92" rx="20" fill="#081329" stroke="url(#redGradMask)" stroke-width="3"/>
      <text x="256" y="214" font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="78" fill="url(#goldGradMask)" text-anchor="middle" letter-spacing="6">ESC</text>
    </g>

    <!-- White Open Book Symbol -->
    <g filter="url(#shadowMask)" transform="translate(0, 10)">
      <!-- Under Pages -->
      <path d="M 256 288 C 220 270, 160 266, 116 276 L 116 348 C 160 338, 220 342, 256 360 C 292 342, 352 338, 396 348 L 396 276 C 352 266, 292 270, 256 288 Z" fill="#cbd5e1"/>
      <!-- Main White Pages -->
      <path d="M 256 280 C 222 262, 166 258, 122 268 L 122 338 C 166 328, 222 332, 256 352 Z" fill="#ffffff"/>
      <path d="M 256 280 C 290 262, 346 258, 390 268 L 390 338 C 346 328, 290 332, 256 352 Z" fill="#f8fafc"/>

      <!-- Text lines -->
      <line x1="146" y1="284" x2="236" y2="294" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="146" y1="298" x2="236" y2="308" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="146" y1="312" x2="220" y2="322" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

      <line x1="276" y1="294" x2="366" y2="284" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="276" y1="308" x2="366" y2="298" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="276" y1="322" x2="350" y2="312" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Spine ribbon -->
      <path d="M 253 280 L 253 370 L 256 366 L 259 370 L 259 280 Z" fill="url(#redGradMask)"/>
      <polygon points="253,366 256,362 259,366 256,374" fill="#f59e0b"/>
    </g>

    <!-- MCQ/OMR Answer Bubble Pill -->
    <g transform="translate(0, 16)">
      <rect x="136" y="366" width="240" height="42" rx="21" fill="#071228" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadowMask)"/>
      
      <!-- Bubble A: Filled Red -->
      <g transform="translate(172, 387)">
        <circle cx="0" cy="0" r="14" fill="url(#redGradMask)" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">A</text>
      </g>
      <!-- Bubble B -->
      <g transform="translate(228, 387)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle">B</text>
      </g>
      <!-- Bubble C -->
      <g transform="translate(284, 387)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle">C</text>
      </g>
      <!-- Bubble D -->
      <g transform="translate(340, 387)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle">D</text>
      </g>
    </g>

    <!-- Branding Typography -->
    <text x="256" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      ENGLISH STUDY CENTRE
    </text>
    <text x="256" y="478" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#f87171" text-anchor="middle" letter-spacing="1">
      Dir. Deepak Sir • Sasaram
    </text>
  </g>
</svg>
