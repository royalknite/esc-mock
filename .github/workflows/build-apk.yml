name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Book + ESC Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Image.open('public/pwa-512x512.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          res = Path('android/app/src/main/res')
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)

          # Remove generated adaptive XMLs so Android uses the exact full-color
          # Book + ESC PNG artwork above on every supported Android version.
          adaptive = res / 'mipmap-anydpi-v26'
          if adaptive.exists():
              for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  (adaptive / name).unlink(missing_ok=True)

          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          strings = values / 'strings.xml'
          if strings.exists():
              tree = ET.parse(strings)
              root = tree.getroot()
          else:
              root = ET.Element('resources')
              tree = ET.ElementTree(root)
          app_name = root.find("string[@name='app_name']")
          if app_name is None:
              app_name = ET.SubElement(root, 'string', {'name': 'app_name'})
          app_name.text = 'ESC'
          tree.write(strings, encoding='utf-8', xml_declaration=True)
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English_Study_Centre_Android_App
          path: android/app/build/outputs/apk/debug/app-debug.apk
